services:
  - type: web
    name: agribora-api
    env: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AGRIBORA_ALLOWED_ORIGINS
        value: https://silvertechelectrical.github.io,http://localhost:5500,http://localhost:5501,http://127.0.0.1:5500,http://127.0.0.1:5501
